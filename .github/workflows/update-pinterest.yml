name: Update Pinterest Archive

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: "stable"

      - name: Install Pinterest CLI
        run: |
          go install github.com/tamnd/pinterest-cli/cmd/pin@latest

      - name: Crawl Pinterest board
        run: |
          mkdir -p data
          pin board pins "https://www.pinterest.com/Shamsowl/think-about-it/" \
            -o jsonl > data/pinterest-raw.jsonl

      - name: Show result
        run: |
          echo "Pinterest results:"
          wc -l data/pinterest-raw.jsonl
          head -n 3 data/pinterest-raw.jsonl

      - name: Commit archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/pinterest-raw.jsonl

          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update Pinterest archive"
            git push
          fi
